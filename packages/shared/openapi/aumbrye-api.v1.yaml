openapi: 3.0.4
info:
  title: Aumbrye API
  description: M4 gameplay loop API (auth + runs + saves + progression).
  version: 1.0.0
paths:
  /api/v1/account/display-name:
    put:
      tags:
        - Account
      operationId: UpdateDisplayName
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDisplayNameRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDisplayNameResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/account:
    delete:
      tags:
        - Account
      operationId: DeleteAccount
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/account/export:
    get:
      tags:
        - Account
      operationId: ExportAccount
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/JsonNode'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/account/link-steam:
    post:
      tags:
        - Account
      operationId: LinkSteam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkSteamRequest'
        required: true
      responses:
        '204':
          description: No Content
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      operationId: Register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
  /api/v1/auth/login:
    post:
      tags:
        - Auth
      operationId: Login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: Refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: Logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/auth/steam:
    post:
      tags:
        - Auth
      operationId: SteamAuth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SteamAuthRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service Unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: Too Many Requests
  /api/v1/health:
    get:
      tags:
        - Health
      operationId: Health
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/leaderboards:
    get:
      tags:
        - Leaderboards
      operationId: GetLeaderboard
      parameters:
        - name: biomeId
          in: query
          schema:
            type: string
        - name: tier
          in: query
          schema:
            type: integer
            format: int32
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeaderboardPageResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/leaderboards/submit:
    post:
      tags:
        - Leaderboards
      operationId: SubmitLeaderboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitLeaderboardRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitLeaderboardResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/runs:
    post:
      tags:
        - Runs
      operationId: CreateRun
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRunResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal Server Error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  '/api/v1/runs/{id}/dungeon':
    get:
      tags:
        - Runs
      operationId: GetRunDungeon
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: floor
          in: query
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
  '/api/v1/runs/{id}/complete':
    post:
      tags:
        - Runs
      operationId: CompleteRun
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteRunRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteRunResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/saves/current:
    get:
      tags:
        - Saves
      operationId: GetCurrentSave
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Unprocessable Content
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    put:
      tags:
        - Saves
      operationId: PutCurrentSave
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutSaveRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSaveResponse'
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PutSaveResponse'
        '413':
          description: Content Too Large
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /api/v1/telemetry/crash:
    post:
      tags:
        - Telemetry
      operationId: CrashTelemetry
      requestBody:
        content:
          application/json:
            schema: { }
        required: true
      responses:
        '204':
          description: No Content
components:
  schemas:
    AuthResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/AuthTokensResponse'
        user:
          $ref: '#/components/schemas/AuthUserResponse'
      additionalProperties: false
    AuthTokensResponse:
      type: object
      properties:
        accessToken:
          type: string
          nullable: true
        refreshToken:
          type: string
          nullable: true
        accessTokenExpiresAt:
          type: string
          format: date-time
      additionalProperties: false
    AuthUserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
      additionalProperties: false
    CompleteRunProgressionResponse:
      type: object
      properties:
        xpGained:
          type: integer
          format: int32
        totalXp:
          type: integer
          format: int32
        level:
          type: integer
          format: int32
        talentPointsEarned:
          type: integer
          format: int32
        lootGranted:
          type: array
          items:
            $ref: '#/components/schemas/LootGrantedResponse'
          nullable: true
        economyNote:
          type: string
          nullable: true
        characterStateJson:
          type: string
          nullable: true
      additionalProperties: false
    CompleteRunRequest:
      type: object
      properties:
        outcome:
          type: string
          nullable: true
        elapsedSeconds:
          type: number
          format: double
        bossDefeated:
          type: boolean
        lootClaimedInstanceIds:
          type: array
          items:
            type: string
          nullable: true
        floor:
          type: integer
          format: int32
      additionalProperties: false
    CompleteRunResponse:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        status:
          type: string
          nullable: true
        progression:
          $ref: '#/components/schemas/CompleteRunProgressionResponse'
      additionalProperties: false
    CreateRunRequest:
      type: object
      properties:
        biomeId:
          type: string
          nullable: true
        seed:
          type: integer
          format: int32
          nullable: true
        tier:
          type: integer
          format: int32
      additionalProperties: false
    CreateRunResponse:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        seed:
          type: integer
          format: int32
        biomeId:
          type: string
          nullable: true
        definitionJson:
          type: string
          nullable: true
      additionalProperties: false
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          nullable: true
      additionalProperties: false
    JsonNode:
      type: object
      properties:
        options:
          $ref: '#/components/schemas/JsonNodeOptions'
        parent:
          $ref: '#/components/schemas/JsonNode'
        root:
          $ref: '#/components/schemas/JsonNode'
      additionalProperties: false
    JsonNodeOptions:
      type: object
      properties:
        propertyNameCaseInsensitive:
          type: boolean
      additionalProperties: false
    LeaderboardEntryResponse:
      type: object
      properties:
        accountId:
          type: string
          format: uuid
        displayName:
          type: string
          nullable: true
        elapsedSeconds:
          type: number
          format: double
        submittedAt:
          type: string
          format: date-time
      additionalProperties: false
    LeaderboardPageResponse:
      type: object
      properties:
        biomeId:
          type: string
          nullable: true
        tier:
          type: integer
          format: int32
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardEntryResponse'
          nullable: true
      additionalProperties: false
    LinkSteamRequest:
      type: object
      properties:
        ticketHex:
          type: string
          nullable: true
        appId:
          type: integer
          format: int32
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    LogoutRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    LootGrantedResponse:
      type: object
      properties:
        instanceId:
          type: string
          nullable: true
        itemDefId:
          type: string
          nullable: true
        itemId:
          type: string
          nullable: true
        rarity:
          type: string
          nullable: true
        affixCount:
          type: integer
          format: int32
          nullable: true
        quantity:
          type: integer
          format: int32
          nullable: true
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: { }
    PutSaveRequest:
      type: object
      properties:
        stateJson:
          type: string
          nullable: true
        clientUpdatedAt:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
    PutSaveResponse:
      type: object
      properties:
        updatedAt:
          type: string
          format: date-time
        conflict:
          type: boolean
        serverStateJson:
          type: string
          nullable: true
      additionalProperties: false
    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
          nullable: true
      additionalProperties: false
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          nullable: true
        password:
          type: string
          nullable: true
      additionalProperties: false
    SaveResponse:
      type: object
      properties:
        stateJson:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false
    SteamAuthRequest:
      type: object
      properties:
        ticketHex:
          type: string
          nullable: true
        appId:
          type: integer
          format: int32
      additionalProperties: false
    SubmitLeaderboardRequest:
      type: object
      properties:
        runId:
          type: string
          format: uuid
        optIn:
          type: boolean
      additionalProperties: false
    SubmitLeaderboardResponse:
      type: object
      properties:
        submitted:
          type: boolean
        rank:
          type: integer
          format: int32
          nullable: true
        reason:
          type: string
          nullable: true
      additionalProperties: false
    UpdateDisplayNameRequest:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
      additionalProperties: false
    UpdateDisplayNameResponse:
      type: object
      properties:
        displayName:
          type: string
          nullable: true
      additionalProperties: false
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - bearerAuth: [ ]
tags:
  - name: Account
  - name: Auth
  - name: Health
  - name: Leaderboards
  - name: Runs
  - name: Saves
  - name: Telemetry