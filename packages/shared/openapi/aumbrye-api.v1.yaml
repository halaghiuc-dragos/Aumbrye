openapi: 3.0.3
info:
  title: Aumbrye API
  version: 1.0.0
  description: M3 server generation API (auth + runs).
servers:
  - url: http://localhost:5000
paths:
  /api/v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /api/v1/auth/register:
    post:
      summary: Register account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "200":
          description: Tokens issued
        "400":
          description: Validation error
  /api/v1/auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Tokens issued
        "401":
          description: Invalid credentials
  /api/v1/auth/refresh:
    post:
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
        "401":
          description: Invalid refresh token
  /api/v1/runs:
    post:
      summary: Create run and generate dungeon
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XContentVersion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "200":
          description: Run created with dungeon definition JSON
        "400":
          description: Generation or validation error
        "401":
          description: Unauthorized
  /api/v1/runs/{id}/dungeon:
    get:
      summary: Get cached dungeon definition
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/XClientVersion"
        - $ref: "#/components/parameters/XContentVersion"
      responses:
        "200":
          description: DungeonDefinition JSON
        "404":
          description: Run not found
  /api/v1/runs/{id}/complete:
    post:
      summary: Complete run (stub validation)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRunRequest"
      responses:
        "200":
          description: Run marked completed
        "400":
          description: Already completed or invalid payload
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    XClientVersion:
      name: X-Client-Version
      in: header
      schema:
        type: string
        example: "0.3.0"
    XContentVersion:
      name: X-Content-Version
      in: header
      schema:
        type: string
        example: "1"
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    CreateRunRequest:
      type: object
      required: [biomeId]
      properties:
        biomeId: { type: string }
        seed: { type: integer }
        tier: { type: integer, default: 1 }
    CompleteRunRequest:
      type: object
      required: [outcome, elapsedSeconds, bossDefeated]
      properties:
        outcome: { type: string, enum: [escaped, died, abandoned] }
        elapsedSeconds: { type: number }
        bossDefeated: { type: boolean }
        lootClaimedInstanceIds:
          type: array
          items: { type: string }
