server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # `SY-11`: no `Cache-Control` meant a stale `index.html` could survive past a version bump --
    # exactly the failure `VersionGate`'s cache-busting reload exists to defeat.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }

    location ~* \.[0-9a-f]{8,}\.(js|css|png|jpg|jpeg|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
