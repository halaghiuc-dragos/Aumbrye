name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TFM: net10.0

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore Aumbrye.sln
      - name: Check for vulnerable packages
        run: |
          set -o pipefail
          dotnet list Aumbrye.sln package --vulnerable --include-transitive | tee /tmp/vuln.log
          ! grep -q "has the following vulnerable packages" /tmp/vuln.log
      - name: Verify format
        run: dotnet format Aumbrye.sln --verify-no-changes
      - name: Build
        run: dotnet build Aumbrye.sln --no-restore --configuration Release
      - name: Verify OpenAPI spec
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          UseInMemoryStores: "true"
        run: |
          dotnet tool restore
          dotnet tool run swagger tofile --yaml --output /tmp/spec.yaml "src/Aumbrye.Api/bin/Release/${TFM}/Aumbrye.Api.dll" v1
          diff /tmp/spec.yaml ../../packages/shared/openapi/aumbrye-api.v1.yaml
      - name: Build procgen-cli
        run: dotnet build ../../tools/procgen-cli/ProcgenCli.csproj --configuration Release
      - name: Test with coverage
        run: dotnet test Aumbrye.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage" --results-directory ./coverage
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: services/backend/coverage/**/coverage.cobertura.xml

  api-image:
    name: API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build API image
        run: docker build -f services/backend/Dockerfile -t aumbrye-api:ci .

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --coverage
      - name: Verify generated API types
        run: npm run generate:api && git diff --exit-code src/api/schema.d.ts
      - name: Build
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke
        env:
          VITE_API_URL: http://localhost:5000
        run: npm run test:e2e

  contract:
    name: API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Regenerate OpenAPI from the API
        working-directory: services/backend
        env:
          ASPNETCORE_ENVIRONMENT: Testing
          UseInMemoryStores: "true"
        run: |
          dotnet tool restore
          dotnet build src/Aumbrye.Api -c Release
          dotnet tool run swagger tofile --yaml --output ../../packages/shared/openapi/aumbrye-api.v1.yaml \
            "src/Aumbrye.Api/bin/Release/${TFM}/Aumbrye.Api.dll" v1
      - name: Regenerate web types
        working-directory: apps/web
        run: npm ci && npm run generate:api
      - name: Fail on drift
        run: git diff --exit-code packages/shared/openapi apps/web/src/api/schema.d.ts

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aumbrye
          POSTGRES_PASSWORD: aumbrye_dev
          POSTGRES_DB: aumbrye
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aumbrye"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Start API
        working-directory: services/backend
        env:
          Jwt__Secret: ${{ secrets.CI_JWT_SECRET }}
          Jwt__AccessTokenMinutes: 1
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=aumbrye;Username=aumbrye;Password=aumbrye_dev
          ConnectionStrings__Redis: localhost:6379
          Cors__AllowedOrigins__0: http://localhost:4173
        run: |
          dotnet run --project src/Aumbrye.Api -c Release &
          npx wait-on http://localhost:5000/api/v1/health --timeout 90000
      - name: Build and serve the site
        working-directory: apps/web
        env:
          VITE_API_URL: http://localhost:5000
          PLAYWRIGHT_API_URL: http://localhost:5000
        run: |
          npm ci && npm run build
          npx vite preview --port 4173 &
          npx wait-on http://localhost:4173 --timeout 60000
      - name: Playwright
        working-directory: apps/web
        env:
          PLAYWRIGHT_API_URL: http://localhost:5000
        run: npx playwright install --with-deps chromium && npx playwright test --project=integration

  python-lint:
    name: Python lint (tools)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ruff
        run: pip install ruff && ruff check tools/

  voxel-import:
    name: Voxel import pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest
      - name: Unit tests
        working-directory: tools/voxel-import
        run: pytest -q
      - name: Regenerate character voxels (dry check)
        run: |
          python tools/generate_character_voxels.py
          git diff --exit-code -- apps/game/client/assets/characters content/characters

  content:
    name: Content validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scripts/validate-content
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/validate-content/package-lock.json
      - name: Install
        run: npm ci
      - name: Validate strict
        run: npm run validate:strict
      - name: Check audio stems on disk
        run: node scripts/tools/generate-biome-audio.mjs --check
        working-directory: ${{ github.workspace }}

  gdscript-lint:
    name: GDScript lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gdlint + gdformat
        run: |
          pip install gdtoolkit
          mapfile -t FILES < <(find apps/game/client/scripts -name '*.gd' -not -path '*/addons/*')
          gdlint "${FILES[@]}"
          gdformat --check "${FILES[@]}"

  godot:
    name: Godot validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/game/client
    steps:
      - uses: actions/checkout@v5
      - name: Read Godot version
        id: godot_version
        run: echo "value=$(cat .godot-version)" >> $GITHUB_OUTPUT
      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ steps.godot_version.outputs.value }}
          include-templates: false
      - name: Verify diorama animation libraries are current
        run: godot --path . --headless --script res://scripts/tools/export_diorama_anim_libraries.gd -- --verify
      - name: Show drift on failure
        if: failure()
        run: |
          godot --path . --headless --script res://scripts/tools/export_diorama_anim_libraries.gd
          git --no-pager diff --stat -- assets/animations/diorama/
          echo "Run the exporter and commit the result." >> "$GITHUB_STEP_SUMMARY"
      - name: Procgen seed health
        run: |
          godot --path . --headless --script res://scripts/tools/procgen_seed_health.gd -- --from 1 --count 500 --max-fallback-rate 0.01 --report reports/procgen_seed_health.json
      - uses: actions/upload-artifact@v4
        with:
          name: procgen-seed-health
          path: reports/procgen_seed_health.json
      - name: Generate balance export
        run: node scripts/balance/balance-cli.mjs
        working-directory: ${{ github.workspace }}
      - name: Run headless validation suites
        run: |
          mkdir -p artifacts
          godot --path . --headless --script res://scripts/validation/validation_main.gd -- --report=artifacts/mcp_validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-validation-report
          path: |
            apps/game/client/artifacts/mcp_validation.json
            apps/game/client/artifacts/mcp_validation.xml
      - name: Assert validation report is non-vacuous
        run: |
          jq -e '.failed == 0 and .total > 0' apps/game/client/artifacts/mcp_validation.json
      - name: Summarize failures
        if: failure()
        run: |
          jq -r '.tests[] | select(.status == "fail") | "FAIL \(.id) [\(.category)] \(.message)"' \
            apps/game/client/artifacts/mcp_validation.json >> "$GITHUB_STEP_SUMMARY" || true

  smoke-test:
    name: Export smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Read Godot version
        id: godot_version
        run: echo "value=$(cat apps/game/client/.godot-version)" >> $GITHUB_OUTPUT
      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v1
        with:
          version: ${{ steps.godot_version.outputs.value }}
          include-templates: true
      - name: Export Linux headless build
        working-directory: apps/game/client
        run: |
          mkdir -p ../../../artifacts/smoke
          godot --headless --path . --export-release "Linux" ../../../artifacts/smoke/aumbrye_smoke.x86_64
      - name: Copy content data next to the export
        run: rsync -a --exclude 'fixtures/' content/ artifacts/smoke/content/
      - name: Run smoke test
        run: |
          chmod +x artifacts/smoke/aumbrye_smoke.x86_64
          ./artifacts/smoke/aumbrye_smoke.x86_64 --headless --smoke-test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-test-export
          path: artifacts/smoke

  openapi-drift:
    name: OpenAPI drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Check route parity
        run: node scripts/openapi-drift/check-routes.mjs

  docs-link-check:
    name: Docs link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress README.md 'docs/**/*.md'
