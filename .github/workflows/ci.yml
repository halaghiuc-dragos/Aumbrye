# C-40: this repository documented a four-layer validation suite and enforced none of it —
# `.github/workflows/` was deleted in 7002986 and never restored, so every check ran only if a
# human remembered to. `pre-commit` only fires for developers who ran `pre-commit install`.
#
# The layers mirror `scripts/validate.mjs` but run as separate jobs so a failure names itself
# without anyone reading a combined log. Godot is fetched as a headless binary rather than run
# through a container, which is the part that made CI awkward enough to delete.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm run validate:strict
      # DOC-01 (see docs/DOC-CONVENTIONS.md §5): fails when a repo path cited in docs or source
      # comments does not exist. C-261 and C-265 were both exactly this shape and both shipped.
      - run: node scripts/check-doc-paths.mjs

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build Aumbrye.sln --configuration Release
      - run: dotnet test Aumbrye.sln --configuration Release --no-build

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check tools/
      - name: voxel-import tests
        working-directory: tools/voxel-import
        run: python run_tests.py

  godot:
    name: godot smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"
      - name: Fetch Godot
        run: |
          set -euo pipefail
          VERSION="${{ steps.godot.outputs.version }}"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${VERSION}-stable_linux.x86_64" godot
          chmod +x godot
      # Import must run before the smoke test: a fresh checkout has no .godot/ cache, so
      # translations and other imported resources do not exist yet.
      - name: Import resources
        run: ./godot --path apps/game/client --headless --import
      - name: Smoke test
        run: ./godot --path apps/game/client --headless -- --smoke-test

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run lint
      - working-directory: apps/web
        run: npm run test
      - working-directory: apps/web
        run: npm run build
