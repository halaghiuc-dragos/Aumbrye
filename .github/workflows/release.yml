# C-265: `content_loader.gd` has always named this file as the pipeline that copies `content/` next
# to the exported binary — and it did not exist. That is not cosmetic: `content/` lives at the repo
# root, *outside* `res://` (which is `apps/game/client/`), so `export_filter="all_resources"` does
# not pack it, and `ContentLoader.content_root()` resolves to the executable's directory in an
# exported build. Without the copy an export ships with no items, enemies, biomes or dialogue —
# exactly the empty-catalogue failure BUG-01 describes and `_verify_content_loaded()` shouts about.
#
# CI (ci.yml) cannot catch this: it runs from source, where `OS.has_feature("editor")` is true and
# content resolves against the repo root. Only an *exported* build exercises the other branch. So
# this workflow ends by running the exported binary's own smoke test — the step that makes shipping
# a contentless build impossible rather than merely unlikely.
#
# NOTE: this workflow has never been executed. It is written against the export presets and the
# pinned engine version in the repo, but the Godot export-template download and the export itself
# are unverified here.
name: Release build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  linux-export:
    name: linux export + exported smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Godot version
        id: godot
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Fetch Godot and export templates
        run: |
          set -euo pipefail
          VERSION="${{ steps.godot.outputs.version }}"
          BASE="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
          curl -fsSL -o godot.zip "${BASE}/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          curl -fsSL -o templates.tpz "${BASE}/Godot_v${VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          mv templates/* "$TEMPLATE_DIR/"

      # A fresh checkout has no .godot/ cache, so imported resources do not exist yet and an
      # export would bake in nothing.
      - name: Import resources
        run: ./godot --path apps/game/client --headless --import

      - name: Export Linux build
        run: |
          set -euo pipefail
          mkdir -p artifacts/smoke
          ./godot --path apps/game/client --headless --export-release "Linux" \
            ../../../artifacts/smoke/aumbrye_smoke.x86_64
          chmod +x artifacts/smoke/aumbrye_smoke.x86_64

      # The step this workflow exists for.
      - name: Stage content next to the binary
        run: cp -r content artifacts/smoke/content

      # Proves the staging worked. `_verify_content_loaded()` fails loudly on an empty catalogue,
      # and `--smoke-test` boots every autoload and subsystem before returning its exit code.
      - name: Smoke test the exported build
        run: ./artifacts/smoke/aumbrye_smoke.x86_64 --headless -- --smoke-test

      - uses: actions/upload-artifact@v4
        with:
          name: aumbrye-linux
          path: artifacts/smoke/
