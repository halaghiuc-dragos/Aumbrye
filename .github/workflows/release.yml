name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ea-1.0.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-image:
    name: API Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aumbrye-api:${{ inputs.tag }}
            ghcr.io/${{ github.repository_owner }}/aumbrye-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  web-build:
    name: Web static build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.WEB_API_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ inputs.tag }}
          path: apps/web/dist
      - name: Deploy web (optional)
        if: vars.DEPLOY_WEB == 'true'
        run: echo "DEPLOY_WEB is set; wire host deploy step here."

  godot-export:
    name: Godot Windows export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Read Godot version
        id: godot_version
        run: echo "value=$(cat apps/game/client/.godot-version)" >> $GITHUB_OUTPUT
      - name: Setup Godot with export templates
        uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ steps.godot_version.outputs.value }}
          include-templates: true
      - name: Verify animation libraries are current
        working-directory: apps/game/client
        run: godot --headless --path . --script res://scripts/tools/export_diorama_anim_libraries.gd -- --verify
      - name: Export Windows Desktop
        working-directory: apps/game/client
        run: |
          mkdir -p ../../../artifacts/godot
          godot --headless --path . --export-release "Windows Desktop" ../../../artifacts/godot/aumbrye.exe
      - name: Copy content data next to the export
        run: rsync -a --exclude 'fixtures/' content/ artifacts/godot/content/
      - uses: actions/upload-artifact@v4
        with:
          name: godot-export-${{ inputs.tag }}
          path: artifacts/godot

  release-summary:
    name: Release summary
    needs: [backend-image, web-build, godot-export]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "Release tag: ${{ inputs.tag }}"
          echo "API image: ghcr.io/${{ github.repository_owner }}/aumbrye-api:${{ inputs.tag }} (+ :latest)"
          echo "Web artifact: web-dist-${{ inputs.tag }}"
          echo "Godot artifact: godot-export-${{ inputs.tag }}"
          echo "Steam upload: manual — requires steamcmd, Steam Guard secret, and app id (not automated)."
