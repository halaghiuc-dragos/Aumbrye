repos:
  - repo: local
    hooks:
      - id: validate-content
        name: validate content JSON
        entry: node scripts/validate-content/validate.mjs
        language: system
        pass_filenames: false
        files: ^content/

      - id: ruff
        name: ruff check tools/
        entry: ruff check tools/
        language: python
        additional_dependencies: [ruff]
        pass_filenames: false
        files: ^tools/

      - id: gdformat-check
        name: gdformat check
        entry: gdformat --check
        language: python
        additional_dependencies: [gdtoolkit]
        files: ^apps/game/client/scripts/.*\.gd$
        exclude: ^apps/game/client/scripts/.*/addons/.*\.gd$
        pass_filenames: true

      - id: gdlint-check
        name: gdlint
        entry: gdlint
        language: python
        additional_dependencies: [gdtoolkit]
        files: ^apps/game/client/scripts/.*\.gd$
        exclude: ^apps/game/client/scripts/.*/addons/.*\.gd$
        pass_filenames: true

      - id: eslint-web
        name: eslint apps/web
        entry: bash -c 'cd apps/web && npm run lint'
        language: system
        files: ^apps/web/
        pass_filenames: false
